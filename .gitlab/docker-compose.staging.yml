services:
  migrations:
    build:
      context: ..
      dockerfile: .gitlab/Dockerfile
      target: base
    environment:
      - DJANGO_SETTINGS_MODULE=printer_dashboard.settings.staging
      - DJANGO_SECRET_KEY
      - POSTGRES_HOST_AUTH_METHOD
      - POSTGRES_DB
      - POSTGRES_USER
      - POSTGRES_PASSWORD
      - POSTGRES_HOST=printer_dashboard-postgres
    depends_on:
      postgres:
        condition: service_healthy
    command: [ "uv", "run", "manage.py", "migrate" ]

  app:
    extends:
      service: migrations
    build:
      context: ..
      dockerfile: .gitlab/Dockerfile
      target: app
    restart: unless-stopped
    command: ["uv", "run", "gunicorn", "-b", ":8000", "--workers=3", "--enable-stdio-inheritance", "printer_dashboard.wsgi:application"]
    expose:
      - 8000
  postgres:
    networks:
      default:
        aliases:
          - printer_dashboard-postgres
    image: postgres:18@sha256:32ca0af8e77bfb8c6610c488e4691f83f972a3e9e64d3b02facf3ab111ad5500
    restart: unless-stopped
    volumes:
      - postgres-data:/var/lib/postgresql/data
    environment:
      - POSTGRES_USER
      - POSTGRES_PASSWORD
      - POSTGRES_DB
    healthcheck:
      test: [ "CMD", "pg_isready", "-q", "-U", "${POSTGRES_USER}" ]
      retries: 3
      timeout: 5s


volumes:
  postgres-data:
